[package]
name = "paramant-core"
version = "0.1.0"
edition = "2021"
authors = ["Mick Beer"]

[lib]
name = "paramant_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = { version = "1.7", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
