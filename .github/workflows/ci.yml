name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check * test * lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml (1.95 + clippy + rustfmt).
      - name: Install pinned toolchain
        run: rustup show
      # The `oqs` crate (from M1) builds liboqs from source via CMake and runs
      # bindgen (needs libclang) to generate the FFI bindings.
      - name: Install liboqs build deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check
        run: cargo check --all
      - name: Test
        run: cargo test --all

  audit:
    name: audit * deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          # Prebuilt binaries  --  independent of the project's 1.95 toolchain.
          tool: cargo-audit,cargo-deny
      - name: Advisory audit
        run: cargo audit
      - name: License / advisory / source policy
        run: |
          if [ -f deny.toml ]; then
            cargo deny check
          else
            echo "no deny.toml  --  skipping"
          fi

  napi-interop:
    name: napi binding interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - name: Install liboqs build deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Build the binding as a cdylib and load it directly as a .node addon.
      # The @napi-rs/cli (for platform-named release artifacts) stays out of the
      # repo per ADR-0006; interop only needs the raw addon.
      - name: Build binding
        run: cargo build -p paramant-core-node --release
      - name: Interop test (binding vs relay-anchored KAT + round-trips)
        run: |
          cp target/release/libparamant_core_node.so /tmp/paramant-core.node
          PARAMANT_ADDON=/tmp/paramant-core.node node crates/paramant-core-node/test/interop.mjs

  cross-impl-rustcrypto-kat:
    name: cross-impl - RustCrypto crate KAT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Validates the RustCrypto crates crypto-wasm depends on (ml-kem, aes-gcm,
      # hkdf, sha2) against the same @noble-anchored tests/kat vectors. Pure-Rust,
      # so no liboqs/aws-lc-rs build deps are needed (ADR-0020).
      - name: RustCrypto crate KAT
        run: cargo test -p cross-impl-validator

  musl-node-binding:
    name: musl build - paramant-core-node (alpine, mirrors the relay image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The relay ships @paramant/core by compiling paramant-core-node inside
      # rust:*-alpine (musl). The other jobs build on ubuntu (glibc), so a
      # musl/alpine-only breakage -- e.g. the `oqs` bindgen/liboqs mismatch that a
      # rust base-image bump can introduce (E0609: no field on OQS_SIG) -- passes
      # CI green but breaks every relay image rebuild. This job reproduces that
      # exact build so the breakage is caught here, not in production.
      #
      # Pinned to the same rust:1.98-alpine digest the relay Dockerfile ships.
      # When bumping the relay's base image, bump it here too: if this job goes
      # red, the new base cannot build the binding and must not be deployed.
      # `--locked` forces the committed Cargo.lock (oqs 0.11.0 + vendored
      # liboqs 0.13.0) so a silent transitive bump can't drift the build either.
      # Checkout runs on the host (the alpine image has no Node for actions), then
      # we mount the tree into the container for the build.
      - name: Build the napi binding on alpine/musl
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            rust:1.98-alpine@sha256:a10e64dd139b7387337c7fbe8aca31b959b57b2fd4c8ae20a02cf1d6ea424dce \
            sh -euc '
              apk add --no-cache musl-dev gcc g++ make cmake ninja clang clang-dev llvm-dev perl nasm git bash
              export LIBCLANG_PATH=/usr/lib
              export RUSTFLAGS="-C target-feature=-crt-static"
              cargo build --locked --release -p paramant-core-node
              test -f target/release/libparamant_core_node.so
            '
