name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check * test * lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Installs the toolchain pinned in rust-toolchain.toml (1.95 + clippy + rustfmt).
      - name: Install pinned toolchain
        run: rustup show
      # The `oqs` crate (from M1) builds liboqs from source via CMake and runs
      # bindgen (needs libclang) to generate the FFI bindings.
      - name: Install liboqs build deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check
        run: cargo check --all
      - name: Test
        run: cargo test --all

  audit:
    name: audit * deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          # Prebuilt binaries  --  independent of the project's 1.95 toolchain.
          tool: cargo-audit,cargo-deny
      - name: Advisory audit
        run: cargo audit
      - name: License / advisory / source policy
        run: |
          if [ -f deny.toml ]; then
            cargo deny check
          else
            echo "no deny.toml  --  skipping"
          fi

  napi-interop:
    name: napi binding interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup show
      - name: Install liboqs build deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Build the binding as a cdylib and load it directly as a .node addon.
      # The @napi-rs/cli (for platform-named release artifacts) stays out of the
      # repo per ADR-0006; interop only needs the raw addon.
      - name: Build binding
        run: cargo build -p paramant-core-node --release
      - name: Interop test (binding vs relay-anchored KAT + round-trips)
        run: |
          cp target/release/libparamant_core_node.so /tmp/paramant-core.node
          PARAMANT_ADDON=/tmp/paramant-core.node node crates/paramant-core-node/test/interop.mjs

  cross-impl-rustcrypto-kat:
    name: cross-impl - RustCrypto crate KAT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Validates the RustCrypto crates crypto-wasm depends on (ml-kem, aes-gcm,
      # hkdf, sha2) against the same @noble-anchored tests/kat vectors. Pure-Rust,
      # so no liboqs/aws-lc-rs build deps are needed (ADR-0020).
      - name: RustCrypto crate KAT
        run: cargo test -p cross-impl-validator
