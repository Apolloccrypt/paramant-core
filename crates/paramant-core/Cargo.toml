[package]
name = "paramant-core"
description = "Post-quantum cryptographic core for Paramant: KEM, signatures, AEAD, KDF, envelopes, wire format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Not published to crates.io until M11 (GA). Keeps `cargo publish` from firing
# early and lets cargo-deny skip the license check on this in-tree crate.
publish = false

[dependencies]
thiserror = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
# M1: ML-KEM-768 via liboqs (built from source by the oqs crate via CMake).
oqs = { workspace = true }
# M2: ECDH P-256 (aws-lc-rs) + HKDF-SHA256 (hkdf/sha2) for the hybrid KEM.
aws-lc-rs = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
# M3: Argon2id password hashing + constant-time tag comparison.
argon2 = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }
