[package]
name = "paramant-core-node"
description = "Node-API (napi-rs) binding for paramant-core, published as @paramant/core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Published to npm as @paramant/core, never to crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
paramant-core = { path = "../paramant-core" }

[build-dependencies]
napi-build = { workspace = true }
