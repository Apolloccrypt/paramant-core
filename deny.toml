# cargo-deny policy. Run: cargo deny check
# Audit-prep from commit 1 (blueprint Sec.9).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses present in the dependency tree. Added deliberately as deps
# arrive (per ADR-0004), not preemptively  --  new crypto deps in M1 will extend it.
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "BSD-3-Clause", # bindgen/oqs-sys build tree (M1)
  "ISC",          # bindgen/oqs-sys build tree (M1)
  "CC0-1.0",      # bip39 / bitcoin_hashes / hex-conservative (M3 BIP-0039 tree)
]
confidence-threshold = 0.9
# paramant-core itself is BUSL-1.1 and unpublished (publish = false); skip the
# license check on in-tree workspace crates.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Local path dependencies (paramant-core-node -> paramant-core, M5) carry no
# version requirement; that is not a real wildcard-version risk.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
